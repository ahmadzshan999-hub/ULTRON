name: ULTRON checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  browser-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check script.js
          node --check supabase-config.js

  supabase-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/ultron-chat/index.ts
          deno check supabase/functions/ultron-admin/index.ts
